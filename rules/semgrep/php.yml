rules:

  # ── SQL Injection ──────────────────────────────────────────────────────────
  - id: php-sql-injection-concat
    message: >
      Possible injection SQL : une variable est concaténée directement dans une
      requête SQL. Utilisez des requêtes préparées (PDO/MySQLi) à la place.
    severity: ERROR
    languages: [php]
    patterns:
      - pattern-either:
          - pattern: mysql_query("..." . $VAR)
          - pattern: mysql_query($QUERY . $VAR)
          - pattern: mysqli_query($CONN, "..." . $VAR)
          - pattern: $PDO->query("..." . $VAR)
    metadata:
      category: security
      cwe: CWE-89
      owasp: A03:2021

  # ── Cross-Site Scripting (XSS) ─────────────────────────────────────────────
  - id: php-xss-echo
    message: >
      Possible XSS : une variable utilisateur est affichée sans encodage.
      Utilisez htmlspecialchars($var, ENT_QUOTES, 'UTF-8').
    severity: ERROR
    languages: [php]
    patterns:
      - pattern-either:
          - pattern: echo $_GET[$KEY];
          - pattern: echo $_POST[$KEY];
          - pattern: echo $_REQUEST[$KEY];
          - pattern: print $_GET[$KEY];
    metadata:
      category: security
      cwe: CWE-79
      owasp: A03:2021

  # ── Command Injection ──────────────────────────────────────────────────────
  - id: php-command-injection
    message: >
      Injection de commande : une variable non validée est passée à exec/system/shell_exec.
      Utilisez escapeshellarg() ou évitez l'exécution de commandes shell.
    severity: ERROR
    languages: [php]
    patterns:
      - pattern-either:
          - pattern: exec($VAR)
          - pattern: system($VAR)
          - pattern: shell_exec($VAR)
          - pattern: passthru($VAR)
          - pattern: popen($VAR, ...)
    metadata:
      category: security
      cwe: CWE-78
      owasp: A03:2021

  # ── Unsafe Deserialization ─────────────────────────────────────────────────
  - id: php-unsafe-unserialize
    message: >
      unserialize() sur des données non fiables peut permettre l'exécution de code.
      Préférez json_decode() ou vérifiez les données avec allowed_classes.
    severity: WARNING
    languages: [php]
    patterns:
      - pattern-either:
          - pattern: unserialize($_GET[$KEY])
          - pattern: unserialize($_POST[$KEY])
          - pattern: unserialize($_COOKIE[$KEY])
          - pattern: unserialize(file_get_contents(...))
    metadata:
      category: security
      cwe: CWE-502
      owasp: A08:2021

  # ── Hardcoded Credentials ──────────────────────────────────────────────────
  - id: php-hardcoded-password
    message: >
      Mot de passe codé en dur détecté. Utilisez des variables d'environnement
      ou un gestionnaire de secrets.
    severity: WARNING
    languages: [php]
    patterns:
      - pattern-either:
          - pattern: $password = "...";
          - pattern: define("DB_PASSWORD", "...");
          - pattern: $db_pass = "...";
    pattern-not-regex: '""|\$\{|\$_ENV'
    metadata:
      category: security
      cwe: CWE-798
