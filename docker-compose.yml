
services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    image: securepipeline:latest
    user: "${UID:-1000}:${GID:-1000}"

    volumes:
      - type: bind
        source: .
        target: /project
        read_only: true
      - type: bind
        source: ./.securepipeline/reports
        target: /project/.securepipeline/reports
        bind:
          create_host_path: true
      # Keeps Trivy's vulnerability database between scans.
      - type: volume
        source: scanner-cache
        target: /cache

    working_dir: /project
    command: ["scan", "/project"]

    environment:
      - SECUREPIPELINE_FAIL_ON=critical

    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
    cap_drop:
      - ALL

volumes:
  scanner-cache:
