name: SecurePipeline Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # Installer les outils de base (exemple: trivy)
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          # Installation d'autres outils (hadolint, etc.) selon les besoins du projet
          wget -O /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo mv /tmp/hadolint /usr/local/bin/hadolint
          sudo chmod +x /usr/local/bin/hadolint
          
          # Installer Semgrep
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Install SecurePipeline
        run: |
          pip install -e .

      - name: Run SecurePipeline Scan
        id: scan
        run: |
          securepipeline --scan . --fail-on critical

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securepipeline-report
          path: .securepipeline/reports/securepipeline-report.md
          
      - name: Comment PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = './.securepipeline/reports/securepipeline-report.md';
            if (fs.existsSync(path)) {
              let report = fs.readFileSync(path, 'utf8');
              // Tronquer si trop long pour github (limite ~65k chars)
              if (report.length > 60000) {
                 report = report.substring(0, 60000) + "\n\n... (Rapport tronqué, voir l'artefact pour les détails complets)";
              }
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            }
