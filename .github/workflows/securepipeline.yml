name: SecurePipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Actions are pinned by SHA: a tag can be moved, a commit cannot.
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install SecurePipeline
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # required to comment on the PR

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0     # Gitleaks scans the full history

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install SecurePipeline and security tools
        run: |
          pip install -e ".[tools]"
          securepipeline tools install --yes --bin-dir "$HOME/.local/bin"

      - name: Run SecurePipeline Scan
        run: securepipeline scan . --fail-on critical --format both

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: securepipeline-report
          path: .securepipeline/reports/
          if-no-files-found: warn

      # Pull requests from forks are not allowed to comment.
      - name: Comment PR with scan results
        if: >-
          always() && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = './.securepipeline/reports/securepipeline-report.md';
            if (!fs.existsSync(reportPath)) {
              console.log('Report not found, skipping the comment.');
              return;
            }
            let report = fs.readFileSync(reportPath, 'utf8');
            // GitHub limits comments to about 65k characters.
            if (report.length > 60000) {
              report = report.substring(0, 60000) +
                '\n\n> Report truncated. Download the full artifact from the Actions run.';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report,
            });
