name: Release

# Pushing a tag such as v0.1.0 builds the package and publishes it to PyPI.
#
# Publishing uses PyPI Trusted Publishing: no token is stored in the repository.
# One-time setup on https://pypi.org/manage/account/publishing/ :
#   owner VISCHENZISCH, repository SecurePipeline,
#   workflow release.yml, environment pypi.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Actions are pinned by SHA: a tag can be moved, a commit cannot.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run the tests
        run: |
          pip install -e ".[dev]"
          ruff check .
          pytest -q

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c "import securepipeline; print(securepipeline.__version__)")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match the package version $VERSION."
            exit 1
          fi

      - name: Build the distributions
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - name: Upload the distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/securepipeline/
    permissions:
      id-token: write   # required by Trusted Publishing
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
