[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "securepipeline"
dynamic = ["version"]
description = "Multi-stack DevSecOps security scanner"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["security", "devsecops", "sast", "sca", "secrets", "scanner", "ci", "semgrep", "trivy", "gitleaks", "rust", "cargo", "osv"]
authors = [
    {name = "Félix TOVIGNAN"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/VISCHENZISCH/SecurePipeline"
Issues = "https://github.com/VISCHENZISCH/SecurePipeline/issues"
Documentation = "https://github.com/VISCHENZISCH/SecurePipeline/blob/main/docs/USAGE.md"
Changelog = "https://github.com/VISCHENZISCH/SecurePipeline/blob/main/CHANGELOG.md"
Security = "https://github.com/VISCHENZISCH/SecurePipeline/security"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]
tools = [
    "pip-audit>=2.7,<3",
    "bandit>=1.7,<2",
    "semgrep>=1.70,<2",
    "checkov>=3.2,<4",
]

[project.scripts]
securepipeline = "securepipeline.cli:main"

[tool.setuptools.dynamic]
version = {attr = "securepipeline.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["securepipeline*"]

[tool.setuptools.package-data]
"securepipeline.rules" = ["semgrep/*.yml"]
"securepipeline.reports" = ["assets/*.css", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
