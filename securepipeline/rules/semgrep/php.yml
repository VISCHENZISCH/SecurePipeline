rules:
  - id: php-sql-injection-concat
    message: >
      Possible SQL injection: a variable is concatenated directly into a SQL
      query. Use prepared statements (PDO/MySQLi) instead.
    severity: ERROR
    languages: [php]
    patterns:
      - pattern-either:
          - pattern: mysql_query("..." . $VAR)
          - pattern: mysql_query($QUERY . $VAR)
          - pattern: mysqli_query($CONN, "..." . $VAR)
          - pattern: $PDO->query("..." . $VAR)
    metadata:
      category: security
      cwe: CWE-89
      owasp: A03:2021

  - id: php-xss-echo
    message: >
      Possible XSS: a user variable is printed without encoding.
      Use htmlspecialchars($var, ENT_QUOTES, 'UTF-8').
    severity: ERROR
    languages: [php]
    patterns:
      - pattern-either:
          - pattern: echo $_GET[$KEY];
          - pattern: echo $_POST[$KEY];
          - pattern: echo $_REQUEST[$KEY];
          - pattern: print $_GET[$KEY];
    metadata:
      category: security
      cwe: CWE-79
      owasp: A03:2021

  - id: php-command-injection
    message: >
      Command injection: an unvalidated variable is passed to exec/system/shell_exec.
      Use escapeshellarg() or avoid running shell commands.
    severity: ERROR
    languages: [php]
    patterns:
      - pattern-either:
          - pattern: exec($VAR)
          - pattern: system($VAR)
          - pattern: shell_exec($VAR)
          - pattern: passthru($VAR)
          - pattern: popen($VAR, ...)
    metadata:
      category: security
      cwe: CWE-78
      owasp: A03:2021

  - id: php-unsafe-unserialize
    message: >
      unserialize() on untrusted data can allow code execution.
      Prefer json_decode() or restrict the data with allowed_classes.
    severity: WARNING
    languages: [php]
    patterns:
      - pattern-either:
          - pattern: unserialize($_GET[$KEY])
          - pattern: unserialize($_POST[$KEY])
          - pattern: unserialize($_COOKIE[$KEY])
          - pattern: unserialize(file_get_contents(...))
    metadata:
      category: security
      cwe: CWE-502
      owasp: A08:2021

  - id: php-hardcoded-password
    message: >
      Hardcoded password detected. Use environment variables or a secret manager.
    severity: WARNING
    languages: [php]
    patterns:
      - pattern-either:
          - pattern: $password = "...";
          - pattern: define("DB_PASSWORD", "...");
          - pattern: $db_pass = "...";
    pattern-not-regex: '""|\$\{|\$_ENV'
    metadata:
      category: security
      cwe: CWE-798
