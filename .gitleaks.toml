# https://github.com/gitleaks/gitleaks#configuration

title = "SecurePipeline Gitleaks Config"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key-custom"
description = "Generic API key"
regex = '''(?i)(api[_-]?key|apikey|api[_-]?secret)\s*[:=]\s*['"]?[A-Za-z0-9\-_]{20,}['"]?'''
entropy = 3.5
tags = ["key", "api"]

[[rules]]
id = "jwt-token"
description = "Exposed JSON Web Token"
regex = '''eyJ[A-Za-z0-9-_]+\.eyJ[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+'''
tags = ["token", "jwt"]

[[rules]]
id = "private-key-header"
description = "PEM private key header"
regex = '''-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
tags = ["key", "private"]

[allowlist]
description = "SecurePipeline global exclusions"

# Secrets in test fixtures and documentation are intentional.
paths = ['''tests/.*''', '''.*\.example''', '''.*\.sample''', '''docs/.*''']

regexes = [
    '''(?i)(your[_-]?api[_-]?key|example[_-]?key|placeholder|changeme|xxxx+)''',
    '''(?i)sk-proj-[A-Za-z0-9]{10,}test''',
]
