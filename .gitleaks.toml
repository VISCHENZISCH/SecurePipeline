# .gitleaks.toml — Configuration Gitleaks pour SecurePipeline
# Doc : https://github.com/gitleaks/gitleaks#configuration

title = "SecurePipeline Gitleaks Config"

# Hérite de toutes les règles prédéfinies de Gitleaks
[extend]
useDefault = true

#  Règles supplémentaires personnalisées ────────────────────────────────────

[[rules]]
id          = "generic-api-key-custom"
description = "Clé API générique (patterns maison)"
regex       = '''(?i)(api[_-]?key|apikey|api[_-]?secret)\s*[:=]\s*['"]?[A-Za-z0-9\-_]{20,}['"]?'''
entropy     = 3.5
tags        = ["key", "api"]

[[rules]]
id          = "jwt-token"
description = "JSON Web Token exposé"
regex       = '''eyJ[A-Za-z0-9-_]+\.eyJ[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+'''
tags        = ["token", "jwt"]

[[rules]]
id          = "private-key-header"
description = "En-tête de clé privée PEM"
regex       = '''-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
tags        = ["key", "private"]

# ── Exclusions (faux positifs connus) ────────────────────────────────────────

[allowlist]
description = "Exclusions globales SecurePipeline"

# Fichiers de test et fixtures — les secrets dans les tests sont intentionnels
paths = [
    '''tests/.*''',
    '''.*\.example''',
    '''.*\.sample''',
    '''docs/.*''',
]

# Patterns à ignorer (placeholders documentés)
regexes = [
    '''(?i)(your[_-]?api[_-]?key|example[_-]?key|placeholder|changeme|xxxx+)''',
    '''(?i)sk-proj-[A-Za-z0-9]{10,}test''',  # clés OpenAI de test
]

# Commits initiaux de bootstrap (à adapter si nécessaire)
# commits = ["abc123def456"]
