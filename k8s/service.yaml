apiVersion: v1
kind: Service
metadata:
  name: securepipeline
  namespace: devsecops
  labels:
    app: securepipeline
spec:
  # SecurePipeline is a CLI tool: no external exposure is intended.
  type: ClusterIP
  selector:
    app: securepipeline
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
