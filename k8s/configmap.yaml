apiVersion: v1
kind: ConfigMap
metadata:
  name: securepipeline-config
  namespace: devsecops
  labels:
    app: securepipeline
    component: config
data:
  SECUREPIPELINE_LOG_LEVEL: "WARNING"
  SECUREPIPELINE_FAIL_ON: "critical"
  SECUREPIPELINE_REPORT_DIR: "/reports"
  SECUREPIPELINE_FORMAT: "both"
