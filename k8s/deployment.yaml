apiVersion: apps/v1
kind: Deployment
metadata:
  name: securepipeline
  namespace: devsecops
  labels:
    app: securepipeline
    version: "1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: securepipeline
  template:
    metadata:
      labels:
        app: securepipeline
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # The scanner does not need the Kubernetes API.
      automountServiceAccountToken: false

      containers:
        - name: securepipeline
          image: securepipeline:latest
          imagePullPolicy: IfNotPresent

          command: ["securepipeline", "scan", "/project", "--fail-on", "critical"]

          envFrom:
            - configMapRef:
                name: securepipeline-config

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          volumeMounts:
            # Writable scratch space, required by the read-only root filesystem.
            - name: tmp-dir
              mountPath: /tmp
            - name: cache-dir
              mountPath: /cache
            - name: reports-dir
              mountPath: /reports
            - name: project-dir
              mountPath: /project
              readOnly: true

      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: cache-dir
          emptyDir: {}
        - name: reports-dir
          emptyDir: {}
        - name: project-dir
          # Replace with a PersistentVolumeClaim in production
          emptyDir: {}

      # The container exits after the scan and must not restart forever.
      restartPolicy: Never
