# No inbound traffic. Outbound is limited to DNS and HTTPS, which the scan
# needs for the Trivy database and the OSV.dev and package registry lookups.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: securepipeline
  namespace: devsecops
  labels:
    app: securepipeline
spec:
  podSelector:
    matchLabels:
      app: securepipeline
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
