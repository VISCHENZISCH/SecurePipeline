# One-shot scan. SecurePipeline is a CLI that exits after the scan,
# so it runs as a Job, not as a Deployment.
#
# Build the image, push it to your registry, then replace the image below,
# ideally pinned by digest: registry.example.com/securepipeline@sha256:...
apiVersion: batch/v1
kind: Job
metadata:
  name: securepipeline-scan
  namespace: devsecops
  labels:
    app: securepipeline
    app.kubernetes.io/version: "0.1.0"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: securepipeline
    spec:
      restartPolicy: Never

      # The scanner does not need the Kubernetes API.
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: securepipeline
          image: registry.example.com/securepipeline:0.1.0
          imagePullPolicy: Always

          command: ["securepipeline", "scan", "/project", "--fail-on", "critical"]

          envFrom:
            - configMapRef:
                name: securepipeline-config

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
              ephemeral-storage: "2Gi"

          volumeMounts:
            # Writable scratch space, required by the read-only root filesystem.
            - name: tmp-dir
              mountPath: /tmp
            - name: cache-dir
              mountPath: /cache
            - name: reports-dir
              mountPath: /reports
            - name: project-dir
              mountPath: /project
              readOnly: true

      volumes:
        - name: tmp-dir
          emptyDir:
            sizeLimit: 256Mi
        - name: cache-dir
          emptyDir:
            sizeLimit: 1Gi
        - name: reports-dir
          emptyDir:
            sizeLimit: 128Mi
        - name: project-dir
          # Replace with a PersistentVolumeClaim holding the code to scan.
          emptyDir: {}
